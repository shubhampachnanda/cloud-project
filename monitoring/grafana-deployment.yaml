apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana    # 🧠 Important: Grafana stores data here
      volumes:
        - name: grafana-storage
          hostPath:                         # 🧠 HostPath in Minikube: survive restarts
            path: /data/grafana
            type: DirectoryOrCreate
